name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build linux binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o dist/gitlab-orchard-executor-linux-amd64 ./cmd/gitlab-orchard-executor
          GOOS=linux GOARCH=arm64 go build -o dist/gitlab-orchard-executor-linux-arm64 ./cmd/gitlab-orchard-executor
      - name: Docker build
        run: docker build -t gitlab-orchard-executor:ci .
